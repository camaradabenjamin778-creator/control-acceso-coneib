<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Acceso ANEIB</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#111}
    header{background:#111;padding:0;text-align:center}header img{display:block;width:100%;height:auto;object-fit:contain}
    .contenedor{width:100%;max-width:900px;margin:auto;padding:25px}
    .contador,.panel{background:#fff;border-radius:15px;padding:25px;margin-bottom:20px;box-shadow:0 3px 12px #00000014}
    .contador{text-align:center}.contadorNumero{font-size:55px;font-weight:bold}.contadorTexto{font-size:18px;color:#666}
    button{border:0;border-radius:10px;padding:15px 20px;font-size:17px;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.5;cursor:wait}.botonEscanear{width:100%;background:#111;color:#fff;margin-bottom:20px}
    .botonCerrar{width:100%;background:#ddd;margin-top:15px}.panel h2{margin-top:0}
    input{width:100%;padding:15px;border:1px solid #ccc;border-radius:10px;font-size:17px;margin-bottom:12px}
    #lectorQR{width:100%;max-width:500px;margin:auto}
    #resultado{display:none;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px;color:#fff}
    #resultado.verde{display:flex;background:#20a957}#resultado.rojo{display:flex;background:#d62828}#resultado.naranjo{display:flex;background:#ed8200}
    #resultado .icono{font-size:90px;margin-bottom:20px}#resultado .mensaje{font-size:35px;font-weight:bold;white-space:pre-line;overflow-wrap:anywhere}
    #resultado button{margin-top:35px;background:#fff;color:#111}
    #busqueda{margin-bottom:15px}.persona{border-top:1px solid #ddd;padding:15px 0}.personaNombre{font-size:19px;font-weight:bold}
    .personaDatos{color:#666;margin:5px 0}.estado{font-weight:bold;margin:10px 0}.estado.ingresado{color:#159447}.estado.pendiente{color:#d28b00}
    .botonDeshacer{background:#ddd;font-size:14px;padding:10px 15px}.ultimo{background:#f0f0f0;border-radius:10px;padding:15px}
    .oculto{display:none!important}#panelScanner{position:fixed;inset:0;z-index:900;background:#fff;padding:20px;overflow:auto}
    .nota{font-size:14px;color:#666}.error{color:#b91c1c}
  </style>
</head>
<body>
  <header><img src="LOGO.png" alt="Logo ANEIB"></header>
  <div class="contenedor">
    <section class="panel" id="acceso">
      <h2>Acceso de organizadores</h2>
      <label for="pin">PIN de organizador</label>
      <input id="pin" type="password" autocomplete="off" placeholder="Introduce el PIN">
      <label for="usuario">Nombre del organizador</label>
      <input id="usuario" type="text" autocomplete="name" placeholder="Tu nombre">
      <button id="btnAcceder" class="botonEscanear" type="button">ENTRAR</button>
      <p class="nota">El PIN se mantiene en memoria mientras esta pestaña esté abierta; no se guarda en GitHub ni en el navegador.</p>
      <p id="mensajeAcceso" role="status"></p>
    </section>
    <div id="aplicacion" class="oculto">
      <div class="contador"><div id="contador" class="contadorNumero">—</div><div class="contadorTexto">personas ingresadas</div></div>
      <button id="btnEscanear" class="botonEscanear">ESCANEAR QR</button>
      <div class="panel"><h2>Último ingreso</h2><div id="ultimoIngreso" class="ultimo">Todavía no hay ingresos registrados en esta sesión.</div></div>
      <div class="panel"><h2>Buscar persona</h2><input id="busqueda" type="search" placeholder="Nombre, correo o ID..."><div id="resultados"></div></div>
      <button id="btnSalir" class="botonCerrar">CERRAR SESIÓN</button>
    </div>
  </div>
  <div id="panelScanner" class="oculto"><h2>Escanear QR</h2><div id="lectorQR"></div><button id="btnCerrarScanner" class="botonCerrar">CERRAR ESCÁNER</button></div>
  <div id="resultado" role="alertdialog" aria-modal="true"><div id="resultadoIcono" class="icono"></div><div id="resultadoMensaje" class="mensaje"></div><button id="btnContinuar">CONTINUAR</button></div>
<script>
'use strict';
// Sustituye este valor por la URL /exec de TU NUEVA implementación de Apps Script.
const API_URL = 'https://script.google.com/macros/s/AKfycbwWD6FxBXsHHbdACcD5YgyZK_xWy9VYsEkqBm4W0YT6gSAXMr5gm_MVX5apTmf04yYF/exec';
let pinSesion = '';
let usuarioSesion = '';
let scanner = null;
let inicioScanner = null;
let procesando = false;
let busquedaTimer = null;
const $ = id => document.getElementById(id);

async function api(accion, parametros = {}) {
  if (!API_URL.startsWith('https://script.google.com/macros/s/')) {
    throw new Error('Debes configurar API_URL en index.html');
  }
  const respuesta = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({accion, ...parametros, pin: pinSesion}),
    redirect: 'follow'
  });
  if (!respuesta.ok) throw new Error('Error HTTP ' + respuesta.status);
  return respuesta.json();
}

function errorConexion(error) {
  console.error(error);
  return 'No se pudo conectar con Apps Script. Revisa la implementación y las restricciones CORS.';
}

$('btnAcceder').addEventListener('click', async () => {
  const pin = $('pin').value;
  const usuario = $('usuario').value.trim();
  if (!pin || !usuario) { $('mensajeAcceso').textContent = 'Introduce tu PIN y tu nombre.'; return; }
  pinSesion = pin;
  usuarioSesion = usuario;
  $('btnAcceder').disabled = true;
  $('mensajeAcceso').textContent = 'Comprobando acceso...';
  try {
    const datos = await api('contador');
    if (datos.ok === false) {
      $('mensajeAcceso').textContent = datos.mensaje || 'PIN incorrecto';
      pinSesion = '';
      return;
    }
    if (typeof datos.ingresados !== 'number') throw new Error('Respuesta inesperada del servidor');
    $('contador').textContent = datos.ingresados;
    $('pin').value = '';
    $('acceso').classList.add('oculto');
    $('aplicacion').classList.remove('oculto');
  } catch (error) {
    $('mensajeAcceso').textContent = errorConexion(error);
    pinSesion = '';
  } finally { $('btnAcceder').disabled = false; }
});

$('btnSalir').addEventListener('click', () => {
  pinSesion = ''; usuarioSesion = '';
  $('aplicacion').classList.add('oculto');
  $('acceso').classList.remove('oculto');
  $('mensajeAcceso').textContent = '';
  $('resultados').replaceChildren();
  $('busqueda').value = '';
});

async function actualizarContador() {
  try {
    const datos = await api('contador');
    if (typeof datos.ingresados === 'number') $('contador').textContent = datos.ingresados;
  } catch (error) { console.error('Contador:', error); }
}

async function abrirScanner() {
  if (inicioScanner || scanner) return;
  $('panelScanner').classList.remove('oculto');
  try {
    scanner = new Html5Qrcode('lectorQR');
    inicioScanner = scanner.start({facingMode:'environment'}, {fps:10, qrbox:{width:250,height:250}}, qrDetectado);
    await inicioScanner;
  } catch (error) {
    console.error(error);
    alert('No se pudo acceder a la cámara. Comprueba los permisos del navegador.');
    try { if (scanner) await scanner.clear(); } catch (_) {}
    scanner = null;
    $('panelScanner').classList.add('oculto');
  } finally { inicioScanner = null; }
}

async function cerrarScanner() {
  if (inicioScanner) { try { await inicioScanner; } catch (_) {} }
  if (scanner) {
    try { if (scanner.isScanning) await scanner.stop(); await scanner.clear(); } catch (error) { console.error(error); }
    scanner = null;
  }
  $('panelScanner').classList.add('oculto');
}

$('btnEscanear').addEventListener('click', abrirScanner);
$('btnCerrarScanner').addEventListener('click', cerrarScanner);

async function qrDetectado(texto) {
  if (procesando) return;
  procesando = true;
  await cerrarScanner();
  try {
    // La comprobación y el registro se realizan juntos en el backend, bajo bloqueo.
    const datos = await api('registrar', {id: texto.trim(), usuario: usuarioSesion});
    if (datos.estado === 'VERDE') {
      mostrarResultado('verde', '✓', 'ENTRADA APROBADA', datos.nombre);
      $('ultimoIngreso').replaceChildren();
      const nombre = document.createElement('strong'); nombre.textContent = datos.nombre || '';
      const id = document.createElement('div'); id.textContent = 'ID: ' + (datos.id || texto);
      $('ultimoIngreso').append(nombre, id);
      actualizarContador();
    } else if (datos.estado === 'NARANJO') {
      mostrarResultado('naranjo', '!', 'ENTRADA YA VALIDADA', datos.nombre);
    } else if (datos.estado === 'ROJO') {
      mostrarResultado('rojo', '✕', 'ENTRADA RECHAZADA', datos.nombre || datos.mensaje);
    } else if (datos.ok === false) {
      mostrarResultado('rojo', '✕', 'NO SE PUDO VALIDAR', datos.mensaje);
    } else {
      throw new Error('Respuesta inesperada del servidor');
    }
  } catch (error) { mostrarResultado('rojo', '!', 'ERROR DE CONEXIÓN', errorConexion(error)); }
}

function mostrarResultado(color, icono, titulo, detalle) {
  $('resultado').className = color;
  $('resultadoIcono').textContent = icono;
  $('resultadoMensaje').textContent = titulo + (detalle ? '\n\n' + detalle : '');
}
$('btnContinuar').addEventListener('click', () => {
  $('resultado').className = '';
  procesando = false;
});

$('busqueda').addEventListener('input', () => {
  clearTimeout(busquedaTimer);
  busquedaTimer = setTimeout(buscarPersonas, 350);
});

async function buscarPersonas() {
  const termino = $('busqueda').value.trim();
  const contenedor = $('resultados');
  contenedor.replaceChildren();
  if (termino.length < 2) return;
  try {
    const datos = await api('personas', {termino});
    if (termino !== $('busqueda').value.trim()) return;
    if (datos.ok === false) throw new Error(datos.mensaje);
    if (!Array.isArray(datos) || datos.length === 0) {
      contenedor.textContent = 'No se encontraron personas.';
      return;
    }
    for (const persona of datos) {
      const div = document.createElement('div'); div.className = 'persona';
      const nombre = document.createElement('div'); nombre.className = 'personaNombre'; nombre.textContent = persona.nombre || '';
      const email = document.createElement('div'); email.className = 'personaDatos'; email.textContent = persona.email || '';
      const id = document.createElement('div'); id.className = 'personaDatos'; id.textContent = 'ID: ' + (persona.id || '');
      const estado = document.createElement('div');
      const ingresado = String(persona.estado || '').toUpperCase() === 'INGRESADO';
      estado.className = 'estado ' + (ingresado ? 'ingresado' : 'pendiente');
      estado.textContent = ingresado ? 'INGRESADO' : 'PENDIENTE';
      div.append(nombre, email, id, estado);
      if (ingresado) {
        const boton = document.createElement('button'); boton.className = 'botonDeshacer';
        boton.textContent = 'DESHACER INGRESO';
        boton.addEventListener('click', () => deshacer(persona.id));
        div.append(boton);
      }
      contenedor.append(div);
    }
  } catch (error) { console.error(error); contenedor.textContent = 'Error al buscar participantes.'; }
}

async function deshacer(id) {
  if (!confirm('¿Seguro que quieres deshacer el ingreso de esta persona?')) return;
  try {
    const datos = await api('deshacer', {id, usuario:usuarioSesion});
    if (datos.ok) {
      alert('Ingreso deshecho correctamente.');
      await actualizarContador();
      await buscarPersonas();
    } else alert(datos.mensaje || 'No se pudo deshacer el ingreso.');
  } catch (error) { alert(errorConexion(error)); }
}
</script>
</body>
</html>
